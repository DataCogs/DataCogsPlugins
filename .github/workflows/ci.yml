name: CI

# The whole suite builds and tests on every PR targeting main - that green
# check is the merge gate (branch protection requires it, and requires the
# PR to be up to date with main, so the PR tree IS the merge result; no
# duplicate build on push). Whole-suite-not-per-plugin is deliberate: the
# plugins share common/ and one JUCE checkout, so a change there must prove
# all three still build and pass tests. Docs-only changes are skipped.
# Tags (vX.Y.Z) run the full release pipeline.
on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  # Manual run (Actions tab) - builds BOTH platforms, so the Windows leg
  # can be exercised on demand without cutting a tag.
  workflow_dispatch:

# A newer push to the same ref supersedes any in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  BUILD_TYPE: Release
  BUILD_DIR: build
  # Universal binaries only where they ship (tag builds feeding the
  # installer); PR/branch builds are arm64-only, halving compile work.
  OSX_ARCHS: ${{ startsWith(github.ref, 'refs/tags/') && 'arm64;x86_64' || 'arm64' }}

jobs:
  build_and_test:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: true # abort the whole run as soon as any platform fails
      # PRs build macOS only (~9 min with warm cache); the slow Windows leg
      # runs on tags (where the release needs it) and manual dispatches.
      matrix: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && fromJSON('{"include":[{"os":"windows-latest","artifact":"Windows"},{"os":"macos-latest","artifact":"macOS"}]}') || fromJSON('{"include":[{"os":"macos-latest","artifact":"macOS"}]}') }}

    steps:
      - name: Get latest CMake
        uses: lukka/get-cmake@latest

      - name: Checkout code
        uses: actions/checkout@v7

      - name: ccache
        if: runner.os != 'Windows'
        uses: hendrikmuhs/ccache-action@v1.2.23
        env:
          # runner images ship untrusted third-party taps; silence the noise
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
        with:
          key: ${{ matrix.os }}

      - name: Configure
        shell: bash
        env:
          # ccache only exists where its setup step ran (not Windows). The
          # VS generator would ignore the launcher vars anyway, but keep
          # the configuration honest for anyone switching to Ninja.
          CCACHE_ARGS: ${{ runner.os != 'Windows' && '-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache' || '' }}
        run: >
          cmake -S . -B ${{ env.BUILD_DIR }}
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DCOPY_PLUGIN_AFTER_BUILD=OFF
          $CCACHE_ARGS
          -DCMAKE_OSX_ARCHITECTURES="${{ env.OSX_ARCHS }}"

      - name: Build
        shell: bash
        run: cmake --build ${{ env.BUILD_DIR }} --config ${{ env.BUILD_TYPE }} --parallel 4

      - name: Test
        working-directory: ${{ env.BUILD_DIR }}
        run: ctest -C ${{ env.BUILD_TYPE }} --output-on-failure

      - name: Zip plugin artefacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for entry in compressor:CompressorPlugin parametric-eq:ParametricEQPlugin convolution-reverb:ConvolutionReverbPlugin; do
            dir="${entry%%:*}"; target="${entry##*:}"
            (cd "${BUILD_DIR}/plugins/${dir}/plugin" && \
             cmake -E tar cf "${GITHUB_WORKSPACE}/dist/${target}-${{ matrix.artifact }}.zip" --format=zip "${target}_artefacts")
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: DataCogsPlugins-${{ matrix.artifact }}
          path: dist/*.zip

  # Tagged releases (vX.Y.Z): sign, package, notarize, publish - hands-free.
  #
  # Required repository secrets (creation walkthrough: docs/CI-SETUP.md):
  #   PACE_ACCOUNT            iLok account with the Cloud-enabled PACE Tools
  #                           license (cloud signing trial)
  #   PACE_PASSWORD           its password - used by iloktool to open the
  #                           iLok Cloud session headlessly. One session per
  #                           machine; concurrent signers need separate
  #                           iLok accounts
  #   PACE_WCGUID             wrap config GUID (product: Data Cogs Plugins)
  #   APPLE_CERT_P12_BASE64   Developer ID Application + Installer certs,
  #                           exported as one .p12, base64-encoded
  #   APPLE_CERT_PASSWORD     the .p12 password
  #   APPLE_TEAM_ID           e.g. 74N92K2DPP
  #   APPLE_NOTARY_APPLE_ID   Apple ID for notarytool
  #   APPLE_NOTARY_PASSWORD   app-specific password for notarytool
  #   GCP_SA_KEY              service-account JSON with read access to the
  #                           private IR library bucket
  package_macos:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    needs: build_and_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download macOS build artifacts
        uses: actions/download-artifact@v8
        with:
          name: DataCogsPlugins-macOS
          path: zips

      - name: Reconstruct build layout
        shell: bash
        run: |
          set -euo pipefail
          for entry in compressor:CompressorPlugin parametric-eq:ParametricEQPlugin convolution-reverb:ConvolutionReverbPlugin; do
            dir="${entry%%:*}"; target="${entry##*:}"
            mkdir -p "build/plugins/${dir}/plugin"
            (cd "build/plugins/${dir}/plugin" && unzip -q "${GITHUB_WORKSPACE}/zips/${target}-macOS.zip")
          done

      - name: Import Apple signing certificates
        env:
          P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN=build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$P12_BASE64" | base64 --decode > certs.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import certs.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          rm certs.p12

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v3

      - name: Install PACE signing SDK
        run: |
          set -euo pipefail
          # One pkg installs the whole stack: wraptool, License Service and
          # iLok License Manager (which provides iloktool). Kept in the
          # private bucket - PACE's installers are not ours to host publicly.
          # Mac AAX must be signed on a Mac, hence this macOS job.
          gcloud storage cp gs://datacogs-ir-library/ci-tools/PACECodeSigningForAAXSDKMac_v6.0.0.zip pace-sdk.zip
          unzip -q pace-sdk.zip
          MOUNT=$(hdiutil attach -nobrowse *.dmg | awk -F'\t' '/\/Volumes\//{print $NF}')
          sudo installer -pkg "$MOUNT"/*.pkg -target /
          hdiutil detach "$MOUNT" -quiet

      - name: Fetch IR library
        shell: bash
        run: |
          mkdir -p ir-library
          gcloud storage rsync --recursive gs://datacogs-ir-library/ir-library ir-library

      - name: Sign AAX (PACE cloud) and build installer
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PACE_ACCOUNT: ${{ secrets.PACE_ACCOUNT }}
          PACE_PASSWORD: ${{ secrets.PACE_PASSWORD }}
          PACE_WCGUID: ${{ secrets.PACE_WCGUID }}
          # a release is fully signed or it is not a release
          REQUIRE_SIGNED: "1"
        run: |
          set -euo pipefail
          # --sign-aax wraptool-signs the staged bundles; PACE_PASSWORD in the
          # environment opens the iLok Cloud session headlessly. The same
          # script signs from a local USB iLok when run on a dev machine.
          ./packaging/build-installer.sh \
            --build-dir build \
            --ir-library ir-library \
            --version "${GITHUB_REF_NAME#v}" \
            --sign-aax \
            --aax-signid "Developer ID Application: Mark Daunt (${APPLE_TEAM_ID})" \
            --sign "Developer ID Installer: Mark Daunt (${APPLE_TEAM_ID})"

      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APP_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          PKG=(dist/*.pkg)
          xcrun notarytool submit "${PKG[0]}" --wait \
            --apple-id "$APPLE_ID" --password "$APP_PASSWORD" --team-id "$TEAM_ID"
          xcrun stapler staple "${PKG[0]}"

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: DataCogsPlugins-Installer-macOS
          path: dist/*.pkg

  # Windows counterpart of package_macos. Windows AAX must be signed ON
  # Windows (PACE rule) - upload the PACE Code Signing SDK *Windows*
  # installer to gs://datacogs-ir-library/ci-tools/ as
  # PACECodeSigningForAAXSDKWin.zip to enable cloud signing here; until
  # then the installer ships unsigned AAX and the log says so loudly.
  # (Authenticode-signing the installer itself needs a Windows code
  # signing cert - future work, tracked in docs/RELEASING.md.)
  package_windows:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    # Serialized after package_macos deliberately: both jobs open an iLok
    # Cloud session, and PACE allows one session per account at a time -
    # concurrent signing would kick one runner's session mid-sign. Drop
    # this once a second (dedicated) CI iLok account exists.
    needs: [build_and_test, package_macos]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download Windows build artifacts
        uses: actions/download-artifact@v8
        with:
          name: DataCogsPlugins-Windows
          path: zips

      - name: Reconstruct build layout
        shell: pwsh
        run: |
          $pairs = @(
            @{ dir = "compressor";         target = "CompressorPlugin" },
            @{ dir = "parametric-eq";      target = "ParametricEQPlugin" },
            @{ dir = "convolution-reverb"; target = "ConvolutionReverbPlugin" }
          )
          foreach ($p in $pairs) {
            $dest = "build/plugins/$($p.dir)/plugin"
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            Expand-Archive -Path "zips/$($p.target)-Windows.zip" -DestinationPath $dest
          }

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v3

      - name: Fetch IR library
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ir-library | Out-Null
          gcloud storage rsync --recursive gs://datacogs-ir-library/ir-library ir-library

      - name: Install PACE signing SDK (if uploaded)
        shell: pwsh
        run: |
          $sdk = "gs://datacogs-ir-library/ci-tools/PACECodeSigningForAAXSDKWin.zip"
          gcloud storage cp $sdk pace-sdk-win.zip
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "PACE Windows SDK not in the bucket - AAX will ship unsigned"
            exit 0
          }
          Expand-Archive pace-sdk-win.zip -DestinationPath pace-sdk
          # The Windows SDK zip ships TWO installers: the Code Signing SDK
          # (wraptool) at the root and redist/LicenseSupport.exe (iloktool).
          # Install every installer found, shallowest first, silently - see
          # PACE's "Silent, unattended installs" documentation.
          $installers = Get-ChildItem pace-sdk -Recurse -Include *.exe,*.msi |
                        Sort-Object { $_.FullName.Split([IO.Path]::DirectorySeparatorChar).Count }
          if (-not $installers) { Write-Error "no installer inside the SDK zip"; exit 1 }
          foreach ($installer in $installers) {
            Write-Host "installing: $($installer.Name)"
            if ($installer.Extension -eq ".msi") {
              Start-Process -Wait -FilePath msiexec -ArgumentList "/i", $installer.FullName, "/qn", "/norestart"
            } else {
              Start-Process -Wait -FilePath $installer.FullName -ArgumentList "/quiet", "/norestart"
            }
          }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer (signs AAX when PACE tools present)
        shell: pwsh
        env:
          PACE_ACCOUNT: ${{ secrets.PACE_ACCOUNT }}
          PACE_PASSWORD: ${{ secrets.PACE_PASSWORD }}
          PACE_WCGUID: ${{ secrets.PACE_WCGUID }}
          # a release is fully signed or it is not a release
          REQUIRE_SIGNED: "1"
        run: |
          $v = $env:GITHUB_REF_NAME -replace '^v', ''
          ./packaging/windows/build-installer.ps1 -Version $v -IrLibrary ir-library

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: DataCogsPlugins-Installer-Windows
          path: dist/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build_and_test, package_macos, package_windows]
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          name: DataCogs Plugins ${{ github.ref_name }}
          draft: true
          files: |
            dist/*.pkg
            dist/*.exe
            dist/*.zip
